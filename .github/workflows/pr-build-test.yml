name: PR Build and Test

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ steps.setup.outputs.dotnet-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        id: setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'      # Change to '9.0.x' or '8.0.x' if you're not on .NET 10 preview
          include-prerelease: true     # Required for .NET 10 previews (remove if on stable)

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/**
            !**/*.pdb                  # optional: exclude debug symbols
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [ unit, integration ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .   # restores binaries to their original locations so --no-build works

      - name: Create test results directory
        run: mkdir -p test-results

      - name: Run Tests
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            dotnet test tests/HotelBooking.Unit.Tests/HotelBooking.Unit.Tests.csproj \
              --no-build \
              --configuration Release \
              --results-directory ./test-results \
              --logger "trx;LogFileName=unit-tests.trx"
          else
            dotnet test tests/HotelBooking.API.Tests/HotelBooking.API.Tests.csproj \
              --no-build \
              --configuration Release \
              --results-directory ./test-results \
              --logger "trx;LogFileName=api-tests.trx"
          fi

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: ${{ matrix.test-type == 'unit' && 'Unit Tests' || 'Integration Tests' }}
          path: test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: 'true'
          list-tests: 'all'