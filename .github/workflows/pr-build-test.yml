unit-tests:
  runs-on: ubuntu-latest
  needs: build

  steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '8.0.x'

  - name: Restore dependencies
    run: dotnet restore

  - name: Build test project
    run: dotnet build tests/HotelBooking.Unit.Tests/HotelBooking.Unit.Tests.csproj --configuration Release

  - name: Run Unit Tests
    run: dotnet test tests/HotelBooking.Unit.Tests/HotelBooking.Unit.Tests.csproj \
          --no-build --configuration Release \
          --logger "trx;LogFileName=unit-tests.trx"

  - name: Publish Unit Test Report
    if: always()
    uses: dorny/test-reporter@v2
    with:
      name: "Unit Tests"
      path: "**/*unit-tests.trx"
      reporter: dotnet-trx
      fail-on-error: "false"
