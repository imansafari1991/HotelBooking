name: PR Build and Test

on:
  pull_request:
    branches: [master, develop ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
  unit-tests:   
    runs-on: ubuntu-latest 
    needs: build
    steps:
    - name: Run Unit Tests
      run: dotnet test tests/HotelBooking.Unit.Tests/HotelBooking.Unit.Tests.csproj --no-build --configuration Release --verbosity normal --logger \"trx;LogFileName=unit-tests.trx\"
  integration-tests:   
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Run Integration Tests
      run: dotnet test tests/HotelBooking.API.Tests/HotelBooking.API.Tests.csproj --no-build --configuration Release --verbosity normal --logger \"trx;LogFileName=api-tests.trx\"
      